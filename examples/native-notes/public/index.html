<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Native notes</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main>
  <h1>Native notes</h1><p>A small app with its own accounts and private notes.</p>
  <p id="status" role="status" aria-live="polite">Loading…</p>
  <section id="signed-out" hidden>
    <form id="signup"><h2>Create an account</h2><label>Username <input name="username" autocomplete="username" required pattern="[A-Za-z0-9_]{3,32}" maxlength="32"></label><label>Password <input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></label><button>Create account</button></form>
    <form id="login"><h2>Sign in</h2><label>Username <input name="username" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form>
  </section>
  <section id="signed-in" hidden><h2>Your notes</h2><form id="note"><label>New note <textarea name="content" required maxlength="2000"></textarea></label><button>Save note</button></form><ul id="notes"></ul><h2>Private attachments</h2><form id="upload"><label>File (up to 1 MiB) <input name="file" type="file" required></label><button>Upload file</button></form><p id="file-usage"></p><ul id="files"></ul><button id="logout">Sign out</button></section>
</main></body></html>
