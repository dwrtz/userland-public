<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Userland Blog CMS</title>
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Userland Blog CMS</h1>
        <p>The latest posts, newest first.</p>
        <p id="account" class="account"></p>
      </header>
      <section id="posts" aria-live="polite"></section>
      <button id="more-posts" type="button" class="secondary" hidden>Show more posts</button>

      <section id="admin" hidden>
        <h2>Write a post</h2>
        <form id="editor">
          <label>Title <input name="title" required maxlength="200"></label>
          <label>Post <textarea name="body" required></textarea></label>
          <label>Image address (optional) <input name="image_url" type="url" placeholder="https://"></label>
          <div class="actions">
            <button type="submit" name="status" value="draft">Save as draft</button>
            <button type="submit" name="status" value="published" class="secondary">Publish now</button>
          </div>
          <p id="editor-message" role="status"></p>
        </form>

        <h2>Drafts</h2>
        <section id="drafts" aria-live="polite"></section>
        <button id="more-drafts" type="button" class="secondary" hidden>Show more drafts</button>
      </section>
    </main>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
